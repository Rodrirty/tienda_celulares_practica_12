<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | CellStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
body{background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.navbar{background:#101c36}.hero{background:linear-gradient(120deg,#172b50,#315b91);color:white}.search-box{max-width:280px}.product-card{height:100%;border:0;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #14213d12;transition:transform .2s}.product-card:hover{transform:translateY(-4px)}.product-card img{height:210px;object-fit:contain;background:white;padding:18px}.product-card .card-body{display:flex;flex-direction:column}.product-card .buy-btn{margin-top:auto}.price{font-size:1.35rem;font-weight:800;color:#1d4ed8}.login-card{max-width:430px;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #14213d14}footer{background:#101c36;color:#dbe5f5}
</style>
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html">📱 CellStore</a><a href="index.html" class="btn btn-outline-light btn-sm">Volver a tienda</a></div></nav>
<main class="container py-5">
  <section id="loginBox" class="login-card mx-auto">
    <h2 class="fw-bold mb-2">Acceso administrador</h2><p class="text-secondary">Ingresa tus credenciales para gestionar el catálogo.</p>
    <form id="loginForm">
      <label class="form-label" for="usuario">Usuario</label><input id="usuario" class="form-control mb-3" required autocomplete="username">
      <label class="form-label" for="clave">Contraseña</label><input id="clave" type="password" class="form-control mb-3" required autocomplete="current-password">
      <button class="btn btn-primary w-100">Ingresar</button>
    </form><div id="loginMsg" class="mt-3"></div>
    <small class="text-secondary d-block mt-3">Demo: admin / cell123</small>
  </section>

  <section id="panel" hidden>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h2 class="fw-bold mb-1">Panel de administración</h2><p class="text-secondary mb-0">Agrega, edita o elimina productos.</p></div>
      <button id="salir" class="btn btn-outline-danger">Cerrar sesión</button>
    </div>
    <div class="card border-0 shadow-sm p-4 mb-4">
      <h5 id="formTitulo" class="fw-bold">Agregar producto</h5>
      <form id="productoForm" class="row g-3">
        <input type="hidden" id="productoId">
        <div class="col-md-6"><label class="form-label">Nombre</label><input id="nombre" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Marca</label><input id="marca" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Categoría</label><select id="categoria" class="form-select"><option>Samsung</option><option>Apple</option><option>Xiaomi</option><option>Motorola</option><option>Otra</option></select></div>
        <div class="col-md-3"><label class="form-label">Precio (Bs)</label><input id="precio" type="number" min="0" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Stock</label><input id="stock" type="number" min="0" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">URL de imagen</label><input id="imagen" type="url" class="form-control" placeholder="https://..." required></div>
        <div class="col-12"><label class="form-label">Descripción</label><input id="descripcion" class="form-control" required></div>
        <div class="col-12 d-flex gap-2"><button class="btn btn-primary" id="guardarBtn">Guardar producto</button><button type="button" id="cancelarEdicion" class="btn btn-outline-secondary" hidden>Cancelar edición</button></div>
      </form><div id="adminMsg" class="mt-3"></div>
    </div>
    <h5 class="fw-bold mb-3">Productos registrados</h5>
    <div class="table-responsive"><table class="table table-hover align-middle bg-white"><thead><tr><th>Producto</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="tablaProductos"></tbody></table></div>
  </section>
</main>
<script>
// Endpoint de MockAPI de CellStore
const API_URL = "https://6aff02633a0e70bc8d546eaa.mockapi.io/celulares";

// Credenciales de demostración para el panel administrativo.
// Cambia estos valores si deseas otras credenciales.
const ADMIN_USER = "admin";
const ADMIN_PASSWORD = "cell123";

const loginBox=document.getElementById("loginBox"),panel=document.getElementById("panel");
const loginForm=document.getElementById("loginForm"),loginMsg=document.getElementById("loginMsg");
const productoForm=document.getElementById("productoForm"),tabla=document.getElementById("tablaProductos");
const adminMsg=document.getElementById("adminMsg");
let productos=[];
function mensaje(el,txt,tipo="success"){el.innerHTML=`<div class="alert alert-${tipo} py-2">${txt}</div>`;}
function autorizado(){loginBox.hidden=true;panel.hidden=false;cargarAdmin();}
loginForm.addEventListener("submit",e=>{e.preventDefault();if(document.getElementById("usuario").value===ADMIN_USER&&document.getElementById("clave").value===ADMIN_PASSWORD){sessionStorage.setItem("cellstore_admin","si");autorizado();}else mensaje(loginMsg,"Usuario o contraseña incorrectos.","danger");});
if(sessionStorage.getItem("cellstore_admin")==="si")autorizado();
document.getElementById("salir").addEventListener("click",()=>{sessionStorage.removeItem("cellstore_admin");location.reload();});
async function cargarAdmin(){
 if(API_URL.includes("PEGA_AQUI")){mensaje(adminMsg,"Configura API_URL en js/config.js con tu endpoint de MockAPI.","warning");return;}
 try{const r=await fetch(API_URL);if(!r.ok)throw new Error();productos=await r.json();dibujarTabla();}
 catch{mensaje(adminMsg,"Error al cargar. Comprueba el endpoint de MockAPI.","danger");}
}
function dibujarTabla(){
 tabla.innerHTML="";
 productos.forEach(p=>{tabla.innerHTML+=`<tr><td>${p.nombre}</td><td>${p.marca}</td><td>Bs ${p.precio}</td><td>${p.stock}</td><td class="text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="editar('${p.id}')">Editar</button><button class="btn btn-sm btn-outline-danger" onclick="eliminar('${p.id}')">Eliminar</button></td></tr>`;});
}
productoForm.addEventListener("submit",async e=>{
 e.preventDefault();
 const id=document.getElementById("productoId").value;
 const p={nombre:document.getElementById("nombre").value,marca:document.getElementById("marca").value,categoria:document.getElementById("categoria").value,precio:Number(document.getElementById("precio").value),stock:Number(document.getElementById("stock").value),imagen:document.getElementById("imagen").value,descripcion:document.getElementById("descripcion").value};
 try{
  const r=await fetch(id?`${API_URL}/${id}`:API_URL,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  if(!r.ok)throw new Error();
  mensaje(adminMsg,id?"Producto actualizado.":"Producto agregado.");
  limpiar();await cargarAdmin();
 }catch{mensaje(adminMsg,"No se pudo guardar el producto. Revisa MockAPI.","danger");}
});
function editar(id){
 const p=productos.find(x=>String(x.id)===String(id));if(!p)return;
 document.getElementById("productoId").value=p.id;
 ["nombre","marca","categoria","precio","stock","imagen","descripcion"].forEach(k=>document.getElementById(k).value=p[k]??"");
 document.getElementById("formTitulo").textContent="Editar producto";
 document.getElementById("guardarBtn").textContent="Guardar cambios";
 document.getElementById("cancelarEdicion").hidden=false;
 window.scrollTo({top:0,behavior:"smooth"});
}
async function eliminar(id){
 if(!confirm("¿Eliminar este producto?"))return;
 try{const r=await fetch(`${API_URL}/${id}`,{method:"DELETE"});if(!r.ok)throw new Error();mensaje(adminMsg,"Producto eliminado.");await cargarAdmin();}
 catch{mensaje(adminMsg,"No se pudo eliminar.","danger");}
}
function limpiar(){productoForm.reset();document.getElementById("productoId").value="";document.getElementById("formTitulo").textContent="Agregar producto";document.getElementById("guardarBtn").textContent="Guardar producto";document.getElementById("cancelarEdicion").hidden=true;}
document.getElementById("cancelarEdicion").addEventListener("click",limpiar);
</script>
</body></html>
