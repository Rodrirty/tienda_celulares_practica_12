<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellStore | Tienda de celulares</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
body{background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.navbar{background:#101c36}.hero{background:linear-gradient(120deg,#172b50,#315b91);color:white}.search-box{max-width:280px}.product-card{height:100%;border:0;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #14213d12;transition:transform .2s}.product-card:hover{transform:translateY(-4px)}.product-card img{height:210px;object-fit:contain;background:white;padding:18px}.product-card .card-body{display:flex;flex-direction:column}.product-card .buy-btn{margin-top:auto}.price{font-size:1.35rem;font-weight:800;color:#1d4ed8}.login-card{max-width:430px;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #14213d14}footer{background:#101c36;color:#dbe5f5}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">📱 CellStore</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="#catalogo">Catálogo</a>
      <a class="btn btn-warning btn-sm fw-semibold" href="admin.html">Administración</a>
    </div>
  </div>
</nav>
<header class="hero">
  <div class="container py-5">
    <span class="badge text-bg-warning mb-3">TECNOLOGÍA A TU ALCANCE</span>
    <h1 class="display-5 fw-bold">Encuentra tu próximo celular</h1>
    <p class="lead mb-0">Marcas reconocidas, buenos precios y modelos para cada necesidad.</p>
  </div>
</header>
<main class="container py-5" id="catalogo">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><h2 class="fw-bold mb-1">Nuestro catálogo</h2><p class="text-secondary mb-0">Los productos se actualizan desde MockAPI.</p></div>
    <input id="buscar" class="form-control search-box" placeholder="Buscar celular..." aria-label="Buscar celular">
  </div>
  <div id="estado" class="alert alert-info">Cargando productos...</div>
  <div id="productos" class="row g-4"></div>
</main>
<footer class="text-center py-4"><div class="container">© 2026 CellStore · Proyecto académico - Práctica 12</div></footer>
<script>
// Endpoint de MockAPI de CellStore
const API_URL = "https://6aff02633a0e70bc8d546eaa.mockapi.io/celulares";

// Credenciales de demostración para el panel administrativo.
// Cambia estos valores si deseas otras credenciales.
const ADMIN_USER = "admin";
const ADMIN_PASSWORD = "cell123";

const contenedor = document.getElementById("productos");
const estado = document.getElementById("estado");
const buscar = document.getElementById("buscar");
let lista = [];

function apiLista(){ return fetch(API_URL).then(r=>{if(!r.ok)throw new Error("No se pudo consultar MockAPI");return r.json();}); }
function mostrarProductos(datos){
  contenedor.innerHTML = "";
  if(!datos.length){contenedor.innerHTML='<p class="text-secondary">No se encontraron productos.</p>';return;}
  datos.forEach(p=>{
    const sinStock = Number(p.stock)<=0;
    contenedor.innerHTML += `
      <div class="col-sm-6 col-lg-4">
        <div class="card product-card">
          <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}" onerror="this.src='https://placehold.co/600x400?text=Celular'">
          <div class="card-body">
            <span class="badge text-bg-light align-self-start mb-2">${p.categoria}</span>
            <h5 class="card-title fw-bold">${p.nombre}</h5>
            <p class="text-secondary small">${p.descripcion || ""}</p>
            <div class="price mb-2">Bs ${Number(p.precio).toLocaleString("es-BO")}</div>
            <p class="small ${sinStock?'text-danger':'text-success'}">${sinStock?'Agotado':'Stock disponible: '+p.stock}</p>
            <button class="btn btn-primary buy-btn" onclick="comprar('${p.id}')" ${sinStock?'disabled':''}>${sinStock?'Sin stock':'Comprar'}</button>
          </div>
        </div>
      </div>`;
  });
}
async function cargar(){
  if(API_URL.includes("PEGA_AQUI")){estado.className="alert alert-warning";estado.textContent="Configura primero API_URL en js/config.js con tu endpoint de MockAPI.";return;}
  try{lista=await apiLista();estado.hidden=true;mostrarProductos(lista);}
  catch(e){estado.className="alert alert-danger";estado.textContent=e.message+". Verifica el endpoint y que hayas creado el recurso productos.";}
}
async function comprar(id){
  const p=lista.find(x=>String(x.id)===String(id));
  if(!p || Number(p.stock)<=0)return;
  try{
    const respuesta=await fetch(`${API_URL}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...p,stock:Number(p.stock)-1})});
    if(!respuesta.ok)throw new Error();
    await cargar();
    alert("Compra registrada. El stock se actualizó correctamente.");
  }catch{alert("No se pudo actualizar el stock. Revisa MockAPI.");}
}
buscar.addEventListener("input",()=>mostrarProductos(lista.filter(p=>(p.nombre+" "+p.marca+" "+p.categoria).toLowerCase().includes(buscar.value.toLowerCase()))));
cargar();
</script>
</body>
</html>
